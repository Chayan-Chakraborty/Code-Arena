spring.application.name=code-arena

# H2 Database
spring.datasource.url=jdbc:h2:mem:codearena;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# Server
server.port=8080

# JWT
app.jwt.secret=ZmQ4ZjAyM2Y0YmNlNDZhM2EyOWE4NDViNzkyMmNlYWZkMjQyM2RkNzc2YjJjZGE3MWRiM2NhZTAwODE2OWE3Mw==
app.jwt.expiration-ms=86400000

# Seed admin user (override via env: APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD / APP_ADMIN_EMAIL)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@codearena.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# Judge0 (RapidAPI public Judge0 CE). Override via env vars.
judge0.url=${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
judge0.host=${JUDGE0_HOST:judge0-ce.p.rapidapi.com}
judge0.api-key=${JUDGE0_API_KEY:}
judge0.java-language-id=62
