spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/codearena?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:codearena}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:codearena}

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
